<body>

      "DOM manipulation and event handling."

    learn:"JavaScript logic, DOM manipulation, event handling, debugging and breaking complex problems into smaller components."
  }
];

const certs = [
  {title:"C++ Programming",issuer:"Infosys | Springboard",date:"July 2026",meta:"150 Hours",img:"certificates/cpp-certificate.jpg",desc:"Course completion certificate focused on C++ programming concepts and problem-solving."},

  {title:"Introduction to Python",issuer:"Infosys | Springboard",date:"February 8, 2026",meta:"Course Completion",img:"certificates/python-certificate.jpg",desc:"Course completion certificate covering foundational Python programming concepts."}
];

const nav = ["About","Education","Skills","Projects","Certificates","My Goal","Let's Connect"];

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function app(){
  const root = document.getElementById("root");
  root.innerHTML = `

            <div><b>4</b><small>Certificates</small></div>
            <div><b>Focus</b><small>Learn · Build · Grow</small></div>

          <div class="float opportunities"><span>Open to</span><b>Internships &<br>Opportunities</b></div>
        </div>
      </section>

      <section id="about" class="section">
        <div class="label">01 · GET TO KNOW ME</div><h2 class="section-title">About <em>Me</em></h2>
        <div class="about-grid">
          <div>
            <p class="big">I’m a passionate <b>B.Tech Computer Science student at Lovely Professional University</b>, currently in my second year.</p>
            <p>I enjoy turning ideas into practical solutions through coding and technology. With a growing foundation in <b>C++, JavaScript, and Data Structures & Algorithms</b>, I’m continuously exploring new technologies, building projects, and strengthening my problem-solving skills to prepare for a career in <b>software development</b>.</p>
          </div>
          <aside><small>MY CURRENT FOCUS</small><div class="tags"><span>C++</span><span>JavaScript</span><span>DSA</span><span>Problem Solving</span></div><p>Learning consistently, building practically, and growing one project at a time.</p></aside>
        </div>
      </section>

      <section id="education" class="section alt">
        <div class="label">02 · ACADEMIC JOURNEY</div><h2 class="section-title">Education</h2>
        <div class="timeline">
          <article><time>2025 — 2029</time><div><span>CURRENTLY IN 2ND YEAR</span><h3>B.Tech — Computer Science & Engineering</h3><b>Lovely Professional University (LPU) · Phagwara, Punjab</b><p>Current CGPA: <strong>9.62</strong> · Expected Graduation: <strong>2029</strong></p></div></article>
          <article><time>2023 — 2024</time><div><span>INTERMEDIATE · CLASS XII</span><h3>89%</h3><b>BCM School, Basant Avenue, Dugri, Ludhiana</b></div></article>

      </section>

  const menuBtn = document.querySelector(".hamb");

  navEl.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {

    menuBtn.setAttribute("aria-expanded","false");
  }));

  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");
  const modalText = document.getElementById("modalText");

  function openCert(i){
    const c = certs[i];
    modalImg.src = c.img;
    modalImg.alt = c.title;
    modalText.innerHTML = "<b>" + escapeHtml(c.title) + "</b> · " + escapeHtml(c.issuer);
    modal.style.display = "grid";
    document.body.style.overflow = "hidden";
  }
  function closeCert(){
    modal.style.display = "none";
    document.body.style.overflow = "";
  }

  document.querySelectorAll("[data-cert]").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      openCert(Number(el.dataset.cert));
    });
  });
  document.getElementById("closeModal").addEventListener("click", closeCert);
  modal.addEventListener("click", e => { if(e.target === modal) closeCert(); });
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeCert(); });
}

app();
</script>
</body>
</html>
